[project]
name = "manager_agent"
version = "0.1.0"
description = "manager_agent using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]==1.6.1"
]

[project.scripts]
manager_agent = "manager_agent.main:run"
run_crew = "manager_agent.main:run"
train = "manager_agent.main:train"
replay = "manager_agent.main:replay"
test = "manager_agent.main:test"
run_with_trigger = "manager_agent.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
