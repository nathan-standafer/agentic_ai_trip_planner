[project]
name = "manual_save_to_db"
version = "0.1.0"
description = "manual_save_to_db using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]==1.6.1"
]

[project.scripts]
manual_save_to_db = "manual_save_to_db.main:run"
run_crew = "manual_save_to_db.main:run"
train = "manual_save_to_db.main:train"
replay = "manual_save_to_db.main:replay"
test = "manual_save_to_db.main:test"
run_with_trigger = "manual_save_to_db.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
