activity_research_task:
  description: >
    Research weather-appropriate activities for the vacation to {location} from {arrival_date} to {departure_date}.

    STEP 1: Check the weather and season for the travel dates.
    - Use SerperTool to search for typical weather in {location} during the travel period
    - Note the expected temperature range, precipitation, and conditions
    - Identify which types of activities are appropriate (indoor vs outdoor)
    - Example: Cincinnati in January = cold winter, avoid outdoor river cruises
    - Example: Phoenix in July = extreme heat, avoid midday outdoor activities

    STEP 2: Calculate how many activities are needed.
    - Count the number of days in the trip (from {arrival_date} to {departure_date})
    - Multiply by 2-3 activities per day
    - Example: 10-day trip needs 20-30 activities MINIMUM

    STEP 3: Check existing activities using RetrieveActivitiesTool with the location parameter.
    - Call RetrieveActivitiesTool with location="{location}" to get only activities for this destination
    - Count how many are already in the database for this location
    - Filter out any existing activities that are NOT appropriate for the weather/season
    - Calculate: needed - weather-appropriate existing = activities to research
    - If enough weather-appropriate activities already exist, skip web research

    STEP 4: If more activities are needed, use SerperTool to research NEW activities.
    - Research activities for EACH destination within {location}
    - Include a MIX of: cultural sites, entertainment, shopping, unique experiences
    - ONLY include activities that are WEATHER-APPROPRIATE for the travel dates
    - Prioritize indoor activities if weather is cold, rainy, or extremely hot
    - Avoid: boat cruises in winter, outdoor water parks in cold weather, desert hikes in summer heat

    STEP 5: List ALL weather-appropriate activities (existing + new) to ensure full trip coverage.

    Trip considerations: {trip_considerations}
    Family's desired activities: {activity_considerations}

    Each NEW activity must include these fields:
    "name", "description", "suggested_duration", "location", "sublocation",
    "http_link", "type", "estimated_duration", "cost", "suitability"

    CRITICAL: Calculate the exact number of days and ensure you have AT LEAST 2-3 activities
    per day. Do not stop researching until you have enough WEATHER-APPROPRIATE activities
    to fill the ENTIRE trip duration. Never suggest activities that are unsuitable for the season.
  expected_output: >
    A comprehensive list with:
    1. Weather assessment for {location} during {arrival_date} to {departure_date}
       (expected conditions, temperature range, and activity recommendations)
    2. Trip duration calculation (X days = need Y activities)
    3. Existing weather-appropriate activities count
    4. New activities researched (with all required fields) - ALL must be weather-appropriate
    5. Total weather-appropriate activities available (should be enough for 2-3 per day)

    Format: Start with "Weather Assessment" section, then separate "Existing Activities"
    and "New Activities (To Be Saved)" sections. Flag any activities that may have
    weather limitations.
  agent: activity_researcher_agent

save_activities_task:
  description: >
    Save ALL NEW activities from the activity_research_task to the database.

    Process:
    1. Review the activities from the research task
    2. Identify NEW activities (not already in database)
    3. For EACH new activity, call SaveActivityTool with these fields:
       - name: Activity name
       - description: Description of the activity
       - suggested_duration: e.g., "2-3 hours"
       - location: City/area name
       - sublocation: Neighborhood or area (optional)
       - http_link: URL for more info (optional)
       - type: Type like "Sightseeing", "Shopping", "Entertainment"
       - estimated_duration: e.g., "2-3 hours"
       - cost: e.g., "Free", "$10-20"
       - suitability: e.g., "All ages, families"

    4. Continue until ALL new activities are saved
    5. Count how many you saved

    IMPORTANT:
    - Call SaveActivityTool once for EACH activity. If there are 20 new activities, call the tool 20 times.
    - The tool automatically checks for duplicates and skips activities that already exist for the location.
    - Report which activities were saved vs skipped as duplicates.
  expected_output: >
    A summary of save operations:
    "Saved X new activities:
    - Row 1: [Activity Name]
    - Row 2: [Activity Name]
    ...
    Skipped Y duplicates:
    - [Activity Name] (already exists for [location])
    ..."
  context:
    - activity_research_task
  agent: activity_saver_agent

scheduling_task:
  description: >
    Schedule ALL activities for the trip to {location} from {arrival_date} to {departure_date}.

    STEP 1: Calculate all dates in the trip.
    - Start date: {arrival_date}
    - End date: {departure_date}
    - List every date between them (inclusive)

    STEP 2: Call RetrieveActivitiesTool with location="{location}" to get activities for this destination.
    - Only retrieve activities specific to {location} for efficient scheduling
    - Consider the trip_considerations for any special scheduling needs: {trip_considerations}

    STEP 3: For EACH date in the trip, schedule 2-3 activities.
    - Use SaveScheduledActivityTool for EVERY activity
    - Required fields: date, time_slot, activity_name, activity_description, location, duration, transportation, notes
    - Use appropriate time slots: "09:00 AM", "12:00 PM", "02:00 PM", "05:00 PM", etc.
    - Match activities to the correct location based on trip itinerary

    STEP 4: Verify completeness.
    - Every date from {arrival_date} to {departure_date} must have at least 2 activities
    - If any date is missing activities, schedule more

    IMPORTANT:
    - Call SaveScheduledActivityTool for EVERY single activity
    - Do NOT stop until ALL dates have 2-3 activities scheduled
    - Count your tool calls to ensure you've scheduled enough
  expected_output: >
    Complete scheduling summary:
    "Scheduling complete for {location}:
    - [Date 1]: Activity 1, Activity 2, Activity 3
    - [Date 2]: Activity 1, Activity 2, Activity 3
    ...
    Total: X activities scheduled across Y days."
  context:
    - save_activities_task
  agent: daily_planner_agent

reporting_task:
  description: >
    Using the RetrieveScheduleTool, retrieve all scheduled activities from the database
    for the vacation to {location} and generate a comprehensive trip itinerary report.
    The schedule already contains dates, times, and logistics information for each activity.
  expected_output: >
    A detailed trip plan for a vacation to {location}, formatted as markdown without '```'

    The output needs to adhere to the following structure. Make adjustments as necessary
    to adhere to the structure while still including all relevant information:

    # Trip Itinerary for {location}, from {arrival_date} to {departure_date}

    ## Summary
    **Major Transportation:**
    - List the main transportation methods, routes, and any passes or tickets required for the trip.

    **Hotel Accommodations:**
    - List the primary hotel(s) with name, address, check-in/check-out dates, and any relevant notes.

    ## Day X - YYYY-MM-DD (Day of the week)
    **Theme:** [Theme for the day based on activities]

    | Time | Activity | Details | Transportation | Duration | Cost |
    |------|----------|---------|----------------|----------|------|
    | 09:00 AM | Activity Name | Description with [link](url) | Transport method | Duration | Cost |
    | 12:00 PM | Lunch | Restaurant name | Walk | 1 hour | Est. cost |
    | 02:00 PM | Activity Name | Description with [link](url) | Transport method | Duration | Cost |
    | 05:00 PM | Activity Name | Description with [link](url) | Transport method | Duration | Cost |
    | 07:00 PM | Dinner | Restaurant suggestion | Walk | 1-2 hours | Est. cost |

    Note: Include links to more information about each activity where available.
  context:
    - scheduling_task
  agent: reporting_analyst
