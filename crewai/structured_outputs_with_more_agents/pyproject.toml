[project]
name = "structured_outputs_with_more_agents"
version = "0.1.0"
description = "structured_outputs_with_more_agents using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]==1.6.1"
]

[project.scripts]
structured_outputs_with_more_agents = "structured_outputs_with_more_agents.main:run"
run_crew = "structured_outputs_with_more_agents.main:run"
train = "structured_outputs_with_more_agents.main:train"
replay = "structured_outputs_with_more_agents.main:replay"
test = "structured_outputs_with_more_agents.main:test"
run_with_trigger = "structured_outputs_with_more_agents.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
