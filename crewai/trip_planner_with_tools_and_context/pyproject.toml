[project]
name = "trip_planner_with_tools_and_context"
version = "0.1.0"
description = "trip_planner_with_tools_and_context using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]==1.6.1"
]

[project.scripts]
trip_planner_with_tools_and_context = "trip_planner_with_tools_and_context.main:run"
run_crew = "trip_planner_with_tools_and_context.main:run"
train = "trip_planner_with_tools_and_context.main:train"
replay = "trip_planner_with_tools_and_context.main:replay"
test = "trip_planner_with_tools_and_context.main:test"
run_with_trigger = "trip_planner_with_tools_and_context.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
